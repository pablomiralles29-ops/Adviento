<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario de Adviento 🎄</title>
<meta name="theme-color" content="#0e1828">

<!-- Vista previa del enlace en WhatsApp: cambia TU-USUARIO por tu usuario de GitHub -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://pablomiralles29-ops.github.io/Adviento/">
<meta property="og:title" content="Calendario de Adviento · versión Nojavidad 🎄">
<meta property="og:description" content="Una puerta cada día hasta Nochebuena. Ábrelo 🎁">
<meta property="og:image" content="https://pablomiralles29-ops.github.io/Adviento/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --noche:#0e1828; --noche2:#18263d;
    --oro:#e0bd6a; --oro-suave:#f3e2b3;
    --rojo:#8f2633; --verde:#1e4a3a; --crema:#efe5d0; --azul:#2a3f66;
    --tinta:#2b1d14;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0e1828}
  html,body{min-height:100%}
  body{
    font-family:"DM Sans",system-ui,sans-serif;
    color:var(--oro-suave);
    background:
      radial-gradient(120% 60% at 50% 0%, #22365a 0%, transparent 60%),
      linear-gradient(180deg,var(--noche2),var(--noche) 70%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  /* Foto de fondo (fija también en iPhone) */
  .fondo{position:fixed;inset:0;z-index:0;pointer-events:none;
         background:#0e1828 url("fondo.jpg") 52% 30% / cover no-repeat}
  .fondo::after{content:"";position:absolute;inset:0;
         background:linear-gradient(180deg,rgba(10,16,28,.25) 0%,rgba(10,16,28,.1) 35%,rgba(10,16,28,.55) 75%,rgba(10,16,28,.85) 100%)}
  @media (max-width:619px){ .fondo{top:-18vh;bottom:auto;height:118vh;background-position:50% 0} }
  #nieve{position:fixed;inset:0;pointer-events:none;z-index:0}

  main{position:relative;z-index:1;max-width:760px;margin:0 auto;
       padding:calc(56px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}

  header{text-align:center;margin-bottom:26px}
  .kicker{font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:var(--oro);opacity:.95;
          text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .version{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:999px;
          font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1rem;color:#fff6e2;
          background:rgba(143,38,51,.85);border:1px solid rgba(224,189,106,.6);box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .juntos{margin-top:6px;font-size:.88rem;color:var(--oro);opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .juntos:empty{display:none}
  header h1,header .estado{text-shadow:0 2px 6px rgba(0,0,0,.9),0 2px 18px rgba(0,0,0,.85)}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:400;font-style:italic;
     font-size:clamp(2.4rem,10vw,3.6rem);line-height:1.05;margin:.25em 0 .2em;color:#fff6e2}
  h1 b{font-weight:600;color:var(--oro)}
  .estado{font-size:.98rem;opacity:.85;min-height:1.4em}
  .adorno{display:block;margin:14px auto 0;width:120px;height:10px;opacity:.7}

  /* ---------- Rejilla de puertas ---------- */
  .marco{container-type:inline-size}
  .rejilla{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;grid-auto-flow:dense;
           grid-auto-rows:calc((100cqw - 30px) / 4 * 1.12)}
  @media (min-width:620px){.rejilla{grid-template-columns:repeat(6,1fr);gap:12px;
           grid-auto-rows:calc((100cqw - 60px) / 6 * 1.12)}}

  .puerta{
    position:relative;border:0;background:none;cursor:pointer;
    perspective:700px;font:inherit;color:inherit;border-radius:10px;
  }
  .puerta.grande{grid-column:span 2;grid-row:span 2}
  .puerta.ancha{grid-column:span 2}
  @media (min-width:620px){.puerta.ancha-d{grid-column:span 2}}

  /* Hueco que aparece al abrir */
  .hueco{
    position:absolute;inset:0;border-radius:10px;
    background:radial-gradient(circle at 50% 40%, #3a2a1c, #1a120c);
    box-shadow:inset 0 3px 12px rgba(0,0,0,.7);
    display:grid;place-items:center;font-size:clamp(1.6rem,7vw,2.3rem);
  }
  .grande .hueco{font-size:clamp(3rem,14vw,4.4rem)}
  .hueco .icono{transform:scale(.4);opacity:0;transition:.5s .35s cubic-bezier(.3,1.6,.5,1)}
  .abierta .hueco .icono{transform:scale(1);opacity:1}

  /* La hoja de la puerta */
  .hoja{
    position:absolute;inset:0;border-radius:10px;transform-origin:0% 50%;
    transition:transform .8s cubic-bezier(.6,.05,.25,1);transform-style:preserve-3d;
    display:grid;place-items:center;
    background:var(--c,var(--rojo));
    box-shadow:0 6px 14px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .hoja::before{ /* marco interior dorado */
    content:"";position:absolute;inset:6px;border-radius:6px;
    border:1.5px dashed color-mix(in srgb,var(--oro) 70%,transparent);
  }
  .hoja::after{ /* pomo */
    content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;margin-top:-3px;
    border-radius:50%;background:var(--oro);box-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .num{
    font-family:"Fraunces",Georgia,serif;font-weight:700;
    font-size:clamp(1.5rem,6.5vw,2.1rem);color:var(--oro);
    text-shadow:0 1px 0 rgba(0,0,0,.25);
  }
  .grande .num{font-size:clamp(3rem,15vw,4.6rem)}
  .puerta[data-tono="crema"] .hoja{--c:var(--crema)}
  .puerta[data-tono="crema"] .num{color:var(--rojo)}
  .puerta[data-tono="crema"] .hoja::before{border-color:color-mix(in srgb,var(--rojo) 45%,transparent)}
  .puerta[data-tono="verde"] .hoja{--c:var(--verde)}
  .puerta[data-tono="azul"]  .hoja{--c:var(--azul)}

  .abierta .hoja{transform:rotateY(-108deg);box-shadow:none}
  .abierta .hoja .num{opacity:.0;transition:opacity .2s .4s}

  /* Bloqueada */
  .bloqueada .hoja{filter:saturate(.55) brightness(.72)}
  .bloqueada .num{opacity:.75}
  .tiembla{animation:tiembla .45s}
  @keyframes tiembla{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

  /* La de hoy brilla */
  .hoy:not(.abierta) .hoja{animation:brillo 2.2s ease-in-out infinite}
  @keyframes brillo{
    0%,100%{box-shadow:0 6px 14px rgba(0,0,0,.35),0 0 0 0 rgba(224,189,106,.0)}
    50%{box-shadow:0 6px 14px rgba(0,0,0,.35),0 0 0 4px rgba(224,189,106,.55),0 0 26px 4px rgba(224,189,106,.35)}
  }
  .puerta:focus-visible{outline:2px solid var(--oro);outline-offset:3px}


  /* =================== ESTILOS DE PUERTA =================== */
  .deco{display:none}
  .puerta{--cinta:var(--oro);--c:var(--rojo)}
  .puerta[data-tono="crema"]{--cinta:var(--rojo)}

  /* ---- 🎁 REGALO: cajas con lazo ---- */
  .estilo-regalo .hoja{
    inset:18% 5% 2% 5%;border-radius:5px;transform-origin:50% 100%;
    transition:transform .7s cubic-bezier(.5,-.4,.3,1),opacity .45s .25s;
    background:
      linear-gradient(180deg,transparent 0 20%,rgba(0,0,0,.22) 20% 23%,transparent 23%),
      linear-gradient(90deg,transparent calc(50% - 6px),var(--cinta) calc(50% - 6px) calc(50% + 6px),transparent calc(50% + 6px)),
      linear-gradient(0deg,transparent calc(56% - 6px),var(--cinta) calc(56% - 6px) calc(56% + 6px),transparent calc(56% + 6px)),
      var(--c);
  }
  .estilo-regalo .hoja::before,.estilo-regalo .hoja::after{display:none}
  .estilo-regalo .deco{display:block;position:absolute;left:50%;top:0;width:12px;height:12px;margin:-9px 0 0 -6px;
    border-radius:50%;background:var(--cinta);z-index:2}
  .estilo-regalo .deco::before,.estilo-regalo .deco::after{content:"";position:absolute;top:-6px;width:22px;height:14px;
    border:5px solid var(--cinta);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
  .estilo-regalo .deco::before{right:7px;transform:rotate(-22deg)}
  .estilo-regalo .deco::after{left:7px;transform:rotate(22deg)}
  .estilo-regalo .grande .deco{transform:scale(1.8)}
  .estilo-regalo .num{margin-top:12%;width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;
    background:#fff6e2;color:var(--rojo);font-size:clamp(1rem,4.6vw,1.4rem);box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .estilo-regalo .grande .num{font-size:clamp(2rem,9vw,3rem)}
  .estilo-regalo .abierta .hoja{transform:translateY(-30%) rotate(-12deg) scale(.8);opacity:0}

  /* ---- 💌 SOBRE: cartas con sello de lacre ---- */
  .estilo-sobre .hoja{
    inset:20% 3%;border-radius:5px;transform-origin:50% 50%;
    transition:transform .6s .25s ease-in,opacity .4s .45s;
  }
  .estilo-sobre .hoja::before{inset:0;border:0;border-radius:5px;
    background:
      linear-gradient(to top right,rgba(0,0,0,.13) 49.5%,transparent 50%) left bottom/50.5% 70% no-repeat,
      linear-gradient(to top left,rgba(0,0,0,.13) 49.5%,transparent 50%) right bottom/50.5% 70% no-repeat}
  .estilo-sobre .hoja::after{display:none}
  .estilo-sobre .deco{display:block;position:absolute;left:0;right:0;top:0;height:58%;z-index:1;
    background:color-mix(in srgb,var(--c) 80%,#000);clip-path:polygon(0 0,100% 0,50% 100%);
    border-radius:5px 5px 0 0;transform-origin:50% 0;transition:transform .45s ease-in-out;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
  .estilo-sobre .num{position:relative;z-index:2;margin-top:10%;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;
    font-size:clamp(.95rem,4.2vw,1.3rem);color:#fff3da;
    background:radial-gradient(circle at 35% 30%,#c0392b,#7a1520 70%);
    box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 0 0 3px rgba(0,0,0,.15)}
  .estilo-sobre .puerta[data-tono="rojo"] .num{background:radial-gradient(circle at 35% 30%,#f0d48a,#b58a2e 70%);color:#5a1a1f}
  .estilo-sobre .grande .num{font-size:clamp(2rem,9vw,3rem)}
  .estilo-sobre .abierta .deco{transform:rotateX(180deg)}
  .estilo-sobre .abierta .num{opacity:0;transition:opacity .2s}
  .estilo-sobre .abierta .hoja{transform:translateY(40%) scale(.85);opacity:0}

  /* ---- 🔴 BOLAS de Navidad colgando ---- */
  .estilo-bola .hoja{background:none;box-shadow:none;transform-origin:50% 0;
    transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .35s .15s}
  .estilo-bola .hoja::before{inset:0 auto auto 50%;width:0;height:14%;border:0;border-left:1px solid rgba(224,189,106,.75);border-radius:0}
  .estilo-bola .hoja::after{left:50%;right:auto;top:12%;width:16%;height:7%;margin:0;transform:translateX(-50%);
    border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,#9c7a32,#f1d68e,#9c7a32);z-index:1}
  .estilo-bola .grande .hoja::after{width:10%}
  .estilo-bola .deco{display:block;position:absolute;top:17%;left:50%;height:80%;aspect-ratio:1;transform:translateX(-50%);
    border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%,rgba(255,255,255,.6),rgba(255,255,255,0) 22%),
      linear-gradient(180deg,transparent 0 76%,rgba(224,189,106,.8) 76% 79%,transparent 79%),
      radial-gradient(circle at 45% 40%,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c) 70%,#000) 85%);
    box-shadow:0 8px 16px rgba(0,0,0,.45)}
  .estilo-bola .num{position:relative;z-index:1;margin-top:28%}
  .estilo-bola .grande .num{margin-top:22%}
  .estilo-regalo .hueco,.estilo-sobre .hueco,
  .estilo-bola .hueco{background:radial-gradient(circle at 50% 55%,rgba(224,189,106,.28),transparent 60%);box-shadow:none}
  .estilo-bola .hueco .icono{margin-top:22%}
  .estilo-bola .abierta .hoja{transform:scale(1.25);opacity:0}
  .estilo-bola .hoy:not(.abierta) .hoja{animation:none}
  .estilo-bola .hoy:not(.abierta) .deco{animation:brillo-bola 2.2s ease-in-out infinite}
  @keyframes brillo-bola{50%{box-shadow:0 8px 16px rgba(0,0,0,.45),0 0 0 4px rgba(224,189,106,.55),0 0 26px 6px rgba(224,189,106,.45)}}
  .estilo-bola .puerta[data-tono="crema"] .num{color:var(--rojo)}

  /* ---- 🍫 CHURROS con chocolate (días sueltos) ---- */
  .puerta.churro .hoja{background:none!important;box-shadow:none;transform-origin:50% 100%;
    transition:transform .55s cubic-bezier(.5,-.3,.3,1),opacity .4s .2s}
  .puerta.churro .hoja::before,.puerta.churro .hoja::after,.puerta.churro .deco{display:none}
  .churro-svg{position:absolute;left:50%;top:50%;height:88%;width:auto;aspect-ratio:1;transform:translate(-50%,-50%);
    filter:drop-shadow(0 5px 7px rgba(0,0,0,.45));overflow:visible}
  .puerta.churro .num{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);margin:0;
    width:auto;height:auto;background:none;box-shadow:none;border-radius:0;
    font-size:clamp(.85rem,3.8vw,1.2rem);color:var(--rojo);text-shadow:none;z-index:1}
  .puerta.churro.grande .num{font-size:clamp(1.8rem,8vw,2.6rem)}
  .puerta.churro .hueco{background:radial-gradient(circle at 50% 55%,rgba(224,189,106,.28),transparent 60%);box-shadow:none}
  .puerta.churro.abierta .hoja{transform:translateY(-25%) scale(.6) rotate(8deg);opacity:0}
  .puerta.churro.hoy:not(.abierta) .hoja{animation:none}
  .puerta.churro.hoy:not(.abierta) .churro-svg{animation:brillo-churro 2.2s ease-in-out infinite}
  @keyframes brillo-churro{50%{filter:drop-shadow(0 0 10px rgba(240,200,110,.95)) drop-shadow(0 5px 7px rgba(0,0,0,.45))}}

  /* =================== ANIMACIÓN AL ABRIR =================== */
  .fx{position:fixed;left:0;top:0;pointer-events:none;z-index:14;border-radius:50%}
  .fx-rayos{width:300px;height:300px;margin:-150px 0 0 -150px;
    background:repeating-conic-gradient(from 0deg,rgba(255,228,160,.75) 0 5deg,transparent 5deg 15deg);
    -webkit-mask:radial-gradient(circle,#000 10%,transparent 68%);mask:radial-gradient(circle,#000 10%,transparent 68%)}
  .fx-destello{width:220px;height:220px;margin:-110px 0 0 -110px;
    background:radial-gradient(circle,rgba(255,250,225,1) 0%,rgba(255,215,130,.65) 28%,transparent 66%)}
  .fx-anillo{width:120px;height:120px;margin:-60px 0 0 -60px;border:3px solid rgba(255,222,150,.95);
    box-shadow:0 0 18px rgba(255,210,120,.8),inset 0 0 18px rgba(255,210,120,.6)}
  .fx-p{position:fixed;left:0;top:0;pointer-events:none;z-index:15;line-height:1;will-change:transform,opacity}
  .carta > .barrido{position:absolute;inset:0;border-radius:11px;overflow:hidden;pointer-events:none;z-index:3}
  .barrido::before{content:"";position:absolute;top:-10%;bottom:-10%;width:45%;left:-70%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),rgba(255,236,180,.5),transparent);
    transform:skewX(-18deg);animation:barrido 1.2s .5s cubic-bezier(.3,.6,.3,1) forwards}
  @keyframes barrido{to{left:140%}}

  /* =================== RULETA =================== */
  .ruleta{margin:16px auto 2px;text-align:center}
  .ruleta-caja{position:relative;width:min(250px,68vw);aspect-ratio:1;margin:0 auto}
  .rueda{position:absolute;inset:0;border-radius:50%;transition:transform 4.8s cubic-bezier(.12,.72,.08,1);
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.28))}
  .rueda svg{width:100%;height:100%;display:block}
  .ruleta-flecha{position:absolute;left:50%;top:-10px;transform:translateX(-50%);z-index:2;width:0;height:0;
    border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid #c99a3a;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
  .ruleta-centro{position:absolute;left:50%;top:50%;width:20%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:2;
    border-radius:50%;display:grid;place-items:center;font-size:clamp(.9rem,4vw,1.2rem);
    background:radial-gradient(circle at 35% 30%,#fff3cf,#d8ae55 60%,#9c7426);box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .boton-girar{margin-top:16px;border:0;border-radius:999px;padding:13px 26px;font:inherit;font-weight:700;font-size:1.05rem;
    color:#fff;background:linear-gradient(180deg,#a83240,#7d1e2a);box-shadow:0 6px 16px rgba(143,38,51,.4);cursor:pointer}
  .boton-girar:active{transform:scale(.97)}
  .boton-girar:disabled{opacity:.55;cursor:default;box-shadow:none}
  .ruleta-res:empty{display:none}
  .ruleta-res{margin-top:16px}

  /* =================== ANIMACIONES DE APERTURA =================== */
  .hoja{z-index:1}
  .puerta.instant .hoja{opacity:0!important;transition:none!important}
  .fx-flash{position:fixed;inset:0;z-index:13;pointer-events:none;
    background:radial-gradient(circle at var(--x) var(--y),#fffaf0 0%,#ffe6a8 28%,rgba(255,221,150,.9) 55%,rgba(255,210,130,.6) 100%)}
  .fx-caja{position:fixed;z-index:14;pointer-events:none}
  .trozo{position:absolute;inset:0;border-radius:4px;
    background:
      linear-gradient(90deg,transparent calc(50% - 5px),#e7c46f calc(50% - 5px) calc(50% + 5px),transparent calc(50% + 5px)),
      linear-gradient(0deg,transparent calc(50% - 5px),#e7c46f calc(50% - 5px) calc(50% + 5px),transparent calc(50% + 5px)),
      radial-gradient(circle,rgba(255,236,190,.95) 1.5px,transparent 2.2px) 0 0/13px 13px,
      repeating-linear-gradient(45deg,#962936 0 7px,#ad3442 7px 14px);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
  .fx-lazo{position:absolute;left:50%;top:0;transform:translate(-50%,-55%);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
  .copo-fx{position:fixed;left:0;top:0;z-index:14;pointer-events:none;border-radius:50%;background:#fff;
    box-shadow:0 0 8px 2px rgba(255,255,255,.85)}
  .fx-blanco{width:220px;height:220px;margin:-110px 0 0 -110px;
    background:radial-gradient(circle,#fff 0%,rgba(230,243,255,.9) 30%,transparent 68%)}
  .reno-fx{position:fixed;left:0;top:0;z-index:14;pointer-events:none}

  /* =================== RENOS =================== */
  .reno-fx svg,.reno-paseo svg{width:100%;height:100%;display:block;overflow:visible}
  .bote,.salto{width:100%;height:100%}
  .pata{transform-box:fill-box;transform-origin:50% 0}
  .corre .pa{animation:paso .26s ease-in-out infinite alternate}
  .corre .pb{animation:paso .26s ease-in-out infinite alternate-reverse}
  .corre .bote{animation:bote .13s ease-in-out infinite alternate}
  .camina .pa{animation:paso2 .45s ease-in-out infinite alternate}
  .camina .pb{animation:paso2 .45s ease-in-out infinite alternate-reverse}
  .camina .bote{animation:bote .225s ease-in-out infinite alternate}
  @keyframes paso{from{transform:rotate(30deg)}to{transform:rotate(-30deg)}}
  @keyframes paso2{from{transform:rotate(15deg)}to{transform:rotate(-15deg)}}
  @keyframes bote{to{transform:translateY(-3px)}}
  .bufanda{transform-box:fill-box;transform-origin:90% 0;animation:ondea .35s ease-in-out infinite alternate}
  @keyframes ondea{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
  .cabeza{transform-box:fill-box;transform-origin:30% 85%}
  .mira .cabeza{animation:mirar 2.2s ease-in-out}
  @keyframes mirar{20%,80%{transform:rotate(-12deg)}}
  .ojo{transform-box:fill-box;transform-origin:center;animation:parpadeo 4s infinite}
  @keyframes parpadeo{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

  .suelo{position:fixed;left:0;right:0;bottom:0;z-index:3;pointer-events:none;height:calc(24px + env(safe-area-inset-bottom))}
  .suelo svg{position:absolute;left:0;top:0;width:100%;height:16px;display:block}
  .suelo::after{content:"";position:absolute;left:0;right:0;top:15px;bottom:0;background:#eef3fa}
  .reno-paseo{position:fixed;left:0;bottom:calc(9px + env(safe-area-inset-bottom));width:66px;height:60px;z-index:4;
    cursor:pointer;-webkit-tap-highlight-color:transparent;will-change:transform}

  .trineo{position:fixed;left:0;top:0;z-index:0;pointer-events:none;color:#f0cf7e;will-change:transform;
    filter:drop-shadow(0 0 6px rgba(255,214,130,.6))}
  .trineo svg{width:100%;height:auto;display:block;overflow:visible}
  .trineo .rs{animation:galope .42s ease-in-out infinite alternate}
  .trineo .rs2{animation-delay:-.1s}.trineo .rs3{animation-delay:-.2s}.trineo .rs4{animation-delay:-.3s}
  @keyframes galope{from{transform:translateY(2px)}to{transform:translateY(-3px)}}
  .estela{position:fixed;left:0;top:0;z-index:0;pointer-events:none;border-radius:50%;background:#ffe7a6;
    box-shadow:0 0 6px 2px rgba(255,214,130,.8)}

  .asoma{position:absolute;left:50%;bottom:100%;width:44%;max-width:62px;aspect-ratio:80/70;z-index:0;pointer-events:none;
    transform:translate(-50%,78%);animation:asomar 5.5s ease-in-out infinite}
  .asoma svg{width:100%;height:100%;display:block}
  @keyframes asomar{0%,50%,100%{transform:translate(-50%,78%)}60%{transform:translate(-50%,16%)}
    66%{transform:translate(-50%,14%) rotate(-7deg)}74%{transform:translate(-50%,15%) rotate(6deg)}82%,88%{transform:translate(-50%,16%) rotate(0)}}
  .estilo-regalo .asoma{bottom:82%}
  .estilo-sobre .asoma{bottom:80%}
  .abierta .asoma,.bloqueada .asoma,.estilo-bola .asoma,.puerta.churro .asoma{display:none}

  /* =================== NIEVE ACUMULADA =================== */
  .capa-nieve{position:absolute;left:-2px;right:-2px;top:calc(var(--nv,5px) * -.55);height:var(--nv,5px);z-index:2;pointer-events:none;
    background:linear-gradient(180deg,#fff,#e8eff9);border-radius:50% 50% 35% 35% / 90% 90% 45% 45%;
    box-shadow:0 2px 3px rgba(0,0,0,.2);transition:transform .5s ease-in,opacity .5s}
  .capa-nieve::before,.capa-nieve::after{content:"";position:absolute;top:55%;background:#f1f6fc;border-radius:0 0 50% 50%}
  .capa-nieve::before{left:18%;width:7px;height:calc(var(--nv,5px) * .9)}
  .capa-nieve::after{right:26%;width:5px;height:calc(var(--nv,5px) * .6)}
  .abierta .capa-nieve{opacity:0;transform:translateY(26px) rotate(6deg)}
  .estilo-regalo .capa-nieve{top:calc(18% - var(--nv,5px) * .55);left:4%;right:4%}
  .estilo-sobre .capa-nieve{top:calc(20% - var(--nv,5px) * .55);left:2%;right:2%}
  .estilo-bola .capa-nieve,.puerta.churro .capa-nieve{display:none}

  /* =================== CUENTA ATRÁS =================== */
  .reloj{margin-top:4px;font-size:.92rem;color:#fff6e2;font-variant-numeric:tabular-nums;text-shadow:0 1px 8px rgba(0,0,0,.85)}
  .reloj:empty{display:none}

  /* =================== CARTERA DE VALES =================== */
  .btn-cartera{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:20;
    border:1px solid rgba(224,189,106,.65);background:rgba(18,28,46,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:#fff6e2;font:inherit;font-weight:700;font-size:.85rem;padding:7px 10px 7px 12px;border-radius:999px;
    display:flex;gap:7px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
  .btn-cartera[hidden]{display:none}
  .btn-cartera b{background:var(--rojo);color:#fff;border-radius:999px;min-width:21px;height:21px;display:grid;place-items:center;
    font-size:.75rem;padding:0 6px}
  .con-prueba .btn-cartera{top:calc(50px + env(safe-area-inset-top))}
  .con-prueba main{padding-top:calc(96px + env(safe-area-inset-top))}
  .tickets{display:flex;flex-direction:column;gap:10px;margin-top:14px;text-align:left}
  .ticket{position:relative;display:flex;border-radius:10px;overflow:hidden;background:var(--rojo);color:#fff4dc;
    cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.18);border:0;font:inherit;text-align:left;width:100%;padding:0}
  .ticket.pend{cursor:default;background:#6d5a4a}
  .ticket-dia{flex:0 0 62px;display:grid;place-content:center;text-align:center;font-size:.62rem;letter-spacing:.15em;
    text-transform:uppercase;border-right:2px dashed rgba(255,244,220,.5);padding:10px 4px;background:rgba(0,0,0,.12)}
  .ticket-dia b{display:block;font-family:"Fraunces",Georgia,serif;font-size:1.5rem;letter-spacing:0}
  .ticket-txt{padding:12px 14px;font-family:"Fraunces",Georgia,serif;font-size:1.02rem;line-height:1.3;font-weight:600;
    display:flex;align-items:center}
  .ticket.usado{opacity:.62}
  .ticket.usado::after{content:"CANJEADO";position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(-12deg);
    border:2px solid #fff4dc;color:#fff4dc;padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:700;letter-spacing:.15em;
    background:rgba(120,25,38,.9)}
  .carta p.nota{font-size:.93rem;text-align:center;opacity:.8}
  .vacio{margin-top:14px;opacity:.7}

  /* Día 24: máquina de escribir */
  .cursor{display:inline-block;margin-left:1px;color:var(--rojo);font-weight:700;animation:cursor .8s steps(1) infinite}
  @keyframes cursor{50%{opacity:0}}

  /* =================== EL VIAJE HACIA TI =================== */
  .viaje{margin:34px auto 0;max-width:520px;background:rgba(14,24,40,.74);border:1px solid rgba(224,189,106,.35);
    border-radius:16px;padding:18px 14px 14px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .viaje h3{font-family:"Fraunces",Georgia,serif;font-weight:600;font-style:italic;text-align:center;color:#fff6e2;font-size:1.45rem}
  .viaje .sub{text-align:center;font-size:.86rem;opacity:.8;margin:2px 0 6px}
  .mapa{display:block;width:100%;max-width:340px;margin:0 auto;overflow:visible}
  .mapa .tierra{fill:rgba(255,246,226,.07);stroke:rgba(224,189,106,.55);stroke-width:1;stroke-linejoin:round}
  .mapa .ruta{fill:none;stroke:rgba(255,246,226,.35);stroke-width:1.6;stroke-dasharray:2 5;stroke-linecap:round}
  .mapa .hecho{fill:none;stroke:#f3d27a;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(255,210,120,.8))}
  .mapa .ciudad{fill:#fff6e2;stroke:#c99a3a;stroke-width:1.5}
  .mapa text{font-family:"DM Sans",system-ui,sans-serif;font-size:10.5px;font-weight:700;fill:#fff6e2;paint-order:stroke;stroke:rgba(10,16,28,.8);stroke-width:3px}
  .mapa .avion{fill:#fff;filter:drop-shadow(0 0 4px rgba(255,220,150,.95))}
  .mapa .pulso{fill:none;stroke:#f3d27a;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulso 1.8s ease-out infinite}
  @keyframes pulso{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
  .embarque{margin-top:12px;background:linear-gradient(180deg,#fffaf0,#f1e6cf);color:var(--tinta);border-radius:12px;
    position:relative;display:grid;grid-template-columns:1fr 86px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .embarque::before,.embarque::after{content:"";position:absolute;right:77px;width:18px;height:18px;border-radius:50%;background:#172338}
  .embarque::before{top:-9px}.embarque::after{bottom:-9px}
  .emb-cuerpo{padding:13px 12px 12px 14px;min-width:0}
  .emb-top{display:flex;justify-content:space-between;align-items:center;font-size:.6rem;letter-spacing:.2em;font-weight:700;color:var(--rojo)}
  .emb-ruta{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px}
  .emb-ruta b{font-family:"Fraunces",Georgia,serif;font-size:1.8rem;line-height:1}
  .emb-ruta small{display:block;font-size:.68rem;opacity:.7;margin-top:2px}
  .emb-ruta .linea{flex:1;margin:0 10px;border-top:2px dashed rgba(143,38,51,.35);position:relative}
  .emb-ruta .linea::after{content:"✈";position:absolute;left:50%;top:-11px;transform:translateX(-50%);color:var(--rojo);font-size:.95rem}
  .emb-datos{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
  .emb-datos div{font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:#7a6650}
  .emb-datos b{display:block;font-size:.82rem;letter-spacing:0;text-transform:none;color:var(--tinta);font-weight:700;line-height:1.25;margin-top:1px}
  .emb-cuenta{margin-top:10px;padding-top:9px;border-top:1px dashed rgba(143,38,51,.3);text-align:center;font-weight:700;
    color:var(--rojo);font-variant-numeric:tabular-nums;font-size:.95rem}
  .emb-talon{border-left:2px dashed rgba(143,38,51,.35);padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;text-align:center;gap:6px;background:rgba(143,38,51,.06);border-radius:0 12px 12px 0}
  .emb-talon .cod{font-family:"Fraunces",Georgia,serif;font-size:1.5rem;font-weight:700;line-height:1}
  .emb-talon small{font-size:.66rem;font-weight:700;color:#7a6650;line-height:1.3}
  .estado-vuelo{font-size:.56rem;font-weight:800;letter-spacing:.1em;padding:4px 5px;border-radius:6px;background:var(--azul);color:#fff;line-height:1.2}
  .estado-vuelo.volando{background:var(--verde)}
  .estado-vuelo.aterrizado{background:var(--rojo)}
  .codigo-barras{width:58px;height:40px;background:repeating-linear-gradient(90deg,#2b1d14 0 2px,transparent 2px 4px,#2b1d14 4px 5px,
    transparent 5px 8px,#2b1d14 8px 11px,transparent 11px 12px,#2b1d14 12px 13px,transparent 13px 15px)}

  /* =================== PÓSIT =================== */
  .carta.con-nota{padding-top:84px}
  .postit{position:absolute!important;top:14px;left:14px;width:118px;padding:9px 9px 10px;z-index:2;
    font-family:"Caveat",cursive;font-size:1rem;line-height:1.08;color:#3b2d12;text-align:left;
    background:linear-gradient(180deg,#fff4a3,#ffe86b);box-shadow:0 4px 8px rgba(0,0,0,.18),inset 0 -6px 10px rgba(0,0,0,.04);
    transform:rotate(-6deg);border-radius:2px 2px 6px 2px}
  .postit::before{content:"";position:absolute;top:-7px;left:50%;width:46px;height:14px;transform:translateX(-50%) rotate(3deg);
    background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* =================== VALES CON DISEÑO PROPIO =================== */
  .carta .vale{text-align:center}
  .vale .v-cab{font-size:.62rem;letter-spacing:.18em;font-weight:700;opacity:.85;margin-bottom:6px}
  .vale .v-meta{font-size:.68rem;letter-spacing:.06em;opacity:.8;margin-top:8px;line-height:1.35}
  .vale-cine{display:flex;padding:0!important;text-align:left;background:#1d1a2e!important;color:#f6e3b0!important;
    border:2px solid #c99a3a!important;outline:none!important;overflow:hidden}
  .vale-cine .v-main{flex:1;padding:14px 12px 12px 14px}
  .vale-cine strong{font-size:1.15rem!important;color:#fff4dc}
  .vale-cine .v-stub{flex:0 0 58px;border-left:2px dashed rgba(201,154,58,.7);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;font-size:.58rem;letter-spacing:.14em;background:rgba(201,154,58,.12)}
  .vale-cine .v-stub b{font-family:"Fraunces",Georgia,serif;font-size:1.7rem;letter-spacing:0;color:#fff4dc}
  .vale-dorsal{background:#fff!important;color:#1b1b1b!important;border:0!important;outline:none!important;
    box-shadow:0 4px 12px rgba(0,0,0,.18);position:relative;padding:16px 18px 14px!important}
  .vale-dorsal .v-cab{color:var(--rojo)}
  .vale-dorsal .dorsal-num{font-family:"DM Sans",sans-serif;font-weight:800;font-size:3.1rem;line-height:1;letter-spacing:-.02em;color:#1b1b1b}
  .vale-dorsal strong{font-size:1rem!important;color:#333}
  .vale-dorsal .pin{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9aa3ad 60%,#5d6670)}
  .vale-dorsal .p1{top:8px;left:8px}.vale-dorsal .p2{top:8px;right:8px}.vale-dorsal .p3{bottom:8px;left:8px}.vale-dorsal .p4{bottom:8px;right:8px}
  .vale-dorsal::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,var(--rojo) 0 14px,var(--verde) 14px 28px)}
  .vale-sushi{background:#161212!important;color:#f1e6d0!important;border:0!important;outline:2px solid #b3262f!important;outline-offset:-6px;
    padding:18px 16px 14px!important}
  .vale-sushi .v-cab{color:#e8b4b8}
  .vale-sushi strong{font-size:1.08rem!important}
  .vale-sushi .precio{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.72rem;font-weight:700;letter-spacing:.12em;color:#f3d27a}
  .vale-sushi .precio::before{content:"";flex:1;border-bottom:2px dotted rgba(241,230,208,.4)}
  .vale-churreria{background:#fffdf6!important;color:#3a2a1a!important;border:0!important;outline:none!important;
    box-shadow:0 4px 12px rgba(0,0,0,.15);padding:0 0 12px!important;overflow:hidden}
  .vale-churreria .v-cab{background:repeating-linear-gradient(90deg,#2f6fb0 0 12px,#fff 12px 24px);color:transparent;height:12px;margin:0 0 10px}
  .vale-churreria .nombre{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:1.15rem;color:#2f6fb0}
  .vale-churreria strong{display:block;padding:0 14px;font-size:1.05rem!important}
  .vale-churreria .v-meta{padding:0 14px}
  .vale-spa{background:linear-gradient(160deg,#e7f1ec,#cfe3da)!important;color:#1f4a3d!important;border:1px solid #9cc5b3!important;
    outline:none!important;padding:16px 16px 14px!important}
  .vale-spa .v-cab{color:#2e6b58}
  .vale-spa strong{font-size:1.12rem!important}
  .vale-spa .flor{font-size:1.4rem;display:block;margin-bottom:4px}
  .ticket.t-cine{background:#1d1a2e}.ticket.t-dorsal{background:#2c3e50}.ticket.t-sushi{background:#161212}
  .ticket.t-churreria{background:#2f6fb0}.ticket.t-spa{background:#2e6b58}

  /* =================== RASCAR LA NIEVE =================== */
  .rasca{position:relative;margin:4px 0 16px;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .carta .rasca img{margin:0;box-shadow:none;border-radius:0}
  .rasca-nieve{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .rasca-pista{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;white-space:nowrap;
    background:rgba(30,50,80,.75);color:#fff;font-size:.8rem;font-weight:700;padding:6px 12px;border-radius:999px;transition:opacity .4s}

  /* =================== POSTAL =================== */
  .postal{margin:6px auto 4px;width:100%;max-width:320px;perspective:1200px}
  .postal-in{position:relative;width:100%;aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.3,1);cursor:pointer}
  .postal.girada .postal-in{transform:rotateY(180deg)}
  .postal-cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.25);background:#fff}
  .postal-frente svg{width:100%;height:100%;display:block}
  .postal-dorso{transform:rotateY(180deg);background:#fbf7ee;padding:14px 14px 12px;text-align:left;overflow-y:auto;
    background-image:repeating-linear-gradient(180deg,transparent 0 23px,rgba(47,111,176,.13) 23px 24px)}
  .postal-sello{position:absolute;top:10px;right:10px;width:50px;height:60px;background:#fff;border:2px dashed #c9b48a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.4rem;transform:rotate(4deg)}
  .postal-sello small{font-size:.5rem;font-weight:800;letter-spacing:.15em;color:#b3262f}
  .postal-mat{position:absolute;top:30px;right:40px;width:56px;height:56px;border:2px solid rgba(80,80,110,.45);border-radius:50%;
    transform:rotate(-14deg);display:grid;place-items:center;font-size:.48rem;font-weight:800;color:rgba(80,80,110,.6);letter-spacing:.08em;text-align:center}
  .postal-fecha{font-family:"Caveat",cursive;font-size:1rem;color:#5b4a2a;margin:2px 96px 6px 0;min-height:64px}
  .postal-texto{font-family:"Caveat",cursive;font-size:.98rem;line-height:1.16;color:#2b2416;white-space:pre-line}
  .postal-firma{font-family:"Caveat",cursive;font-size:1.05rem;font-weight:700;color:var(--rojo);margin-top:6px}
  .postal-para{margin-top:8px;font-size:.62rem;letter-spacing:.08em;color:#7a6650;
    border-top:1px solid rgba(122,102,80,.4);padding-top:5px}
  .postal-pista{text-align:center;font-size:.8rem;opacity:.65;margin-top:8px}

  /* =================== PREGUNTA DEL DÍA =================== */
  .pregunta{margin:16px 0 4px;padding:14px 14px 12px;border-radius:12px;background:rgba(47,111,176,.08);border:1px solid rgba(47,111,176,.25);text-align:center}
  .pregunta small{display:block;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#2f6fb0}
  .carta .pregunta p{text-align:center;font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.05rem;margin:6px 0 2px}
  .carta .boton-wa{background:#1fa855;margin-top:10px;padding:10px 18px;font-size:.92rem}

  /* =================== JUEGOS =================== */
  .juego{margin-top:12px;text-align:center}
  .juego-msg{text-align:center!important;font-weight:700;margin-bottom:10px}
  .juego-niveles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .nivel{border:0;border-radius:12px;padding:10px 12px;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;color:#fff;
    min-width:88px;box-shadow:0 4px 10px rgba(0,0,0,.18);line-height:1.2}
  .nivel small{display:block;font-weight:500;font-size:.68rem;opacity:.9}
  .nivel.facil{background:#2e8b57}.nivel.normal{background:#c9922a}.nivel.dificil{background:#b3262f}
  .juego-hud{font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:8px;color:var(--rojo)}
  .juego-canvas{display:block;width:100%;border-radius:12px;touch-action:none;background:linear-gradient(180deg,#fff7e6,#f3e3c6);
    box-shadow:inset 0 0 0 1px rgba(143,38,51,.15)}
  .juego-botones{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .btn-juego{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--verde);color:#fff}
  .btn-juego.claro{background:#e9dcc3;color:var(--tinta)}
  .juego-premio:empty{display:none}
  .juego-premio{margin-top:14px}
  .memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .memo-carta{aspect-ratio:3/4;border:0;padding:0;background:none;perspective:600px;cursor:pointer}
  .memo-in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
  .memo-carta.vuelta .memo-in{transform:rotateY(180deg)}
  .memo-dorso,.memo-cara{position:absolute;inset:0;border-radius:9px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .memo-dorso{background:radial-gradient(circle at 50% 40%,#c23a43,#7d1e2a);font-size:1.2rem;box-shadow:0 3px 8px rgba(0,0,0,.2);
    border:2px solid #e0bd6a}
  .memo-cara{background:#fffaf0;font-size:2rem;transform:rotateY(180deg);border:2px solid #e0bd6a}
  .memo-carta.hecha .memo-cara{background:#eaf6ea;border-color:#2e8b57}

  /* =================== BOTÓN ÁNIMOS =================== */
  .btn-animos{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:20;border:1px solid rgba(224,189,106,.65);
    background:rgba(18,28,46,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff6e2;font:inherit;font-weight:700;
    font-size:.85rem;padding:7px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
  .con-prueba .btn-animos{top:calc(50px + env(safe-area-inset-top))}
  .burbuja-animo{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:21;width:min(340px,calc(100% - 32px));
    transform:translateX(-50%);background:#fffaf0;color:var(--tinta);border-radius:16px;padding:14px 16px;text-align:center;
    font-family:"Fraunces",Georgia,serif;font-size:1.05rem;font-weight:600;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.45);
    border:1px solid rgba(143,38,51,.2)}
  .burbuja-animo small{display:block;font-family:"DM Sans",sans-serif;font-size:.62rem;letter-spacing:.2em;color:var(--rojo);margin-bottom:4px}

  /* =================== TIEMPO =================== */

  /* =================== PANTALLA DEL 26 =================== */
  .llegada{position:fixed;inset:0;z-index:9;overflow-y:auto;background:rgba(10,16,28,.82);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);

  .llegada h2{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(2.4rem,11vw,3.4rem);color:#f3d27a;margin:.1em 0 .15em}

  .polaroid{background:#fff;padding:8px 8px 26px;width:min(150px,42%);box-shadow:0 8px 18px rgba(0,0,0,.4);position:relative}
  .polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
  .polaroid span{position:absolute;left:0;right:0;bottom:5px;font-family:"Caveat",cursive;font-size:1.05rem;color:#333}
  .llegada-botones{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:22px}
  .btn-oro{border:0;border-radius:999px;padding:13px 24px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;
    background:linear-gradient(180deg,#f3d27a,#c99a3a);color:#3b2410;box-shadow:0 6px 16px rgba(201,154,58,.4)}
  .btn-claro{border:1px solid rgba(255,246,226,.5);border-radius:999px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;
    background:transparent;color:#fff6e2}

  footer{text-align:center;margin-top:30px;font-family:"Fraunces",Georgia,serif;font-style:italic;opacity:.75}

  /* ---------- Modal ---------- */
  .velo{
    position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;
    background:rgba(6,10,18,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);

  }
  .velo.visible{opacity:1;pointer-events:auto}
  .carta{
    position:relative;width:min(440px,100%);max-height:88vh;overflow:auto;
    background:
      radial-gradient(120% 80% at 50% 0%, #fffaf0, #f3e8d2);
    color:var(--tinta);border-radius:16px;padding:30px 24px 24px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    transform:translateY(24px) scale(.96);transition:transform .4s cubic-bezier(.2,1.2,.4,1);
  }
  .velo.visible .carta{transform:none}
  .carta{border:1px solid rgba(143,38,51,.28);border-radius:11px;width:min(424px,calc(100% - 16px));max-height:calc(88vh - 16px);
    box-shadow:0 0 0 8px #f8f0e0,0 0 0 9px rgba(143,38,51,.08),0 20px 60px rgba(0,0,0,.5)}
  .cerrar{
    position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;

  }

    border-radius:10px;margin:4px 0 16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}

  }

    border-radius:8px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}

<body>
<div class="fondo" aria-hidden="true"></div>

<main>
  <header>
    <div class="kicker">Calendario de Adviento</div>
    <div class="version">versión Nojavidad ✨</div>
    <h1>para <b id="nombre">ti</b></h1>
    <p class="estado" id="estado"></p>
    <p class="reloj" id="reloj"></p>
    <p class="juntos" id="juntos"></p>
    <p class="tiempo" id="tiempo"></p>
    <svg class="adorno" viewBox="0 0 120 10" aria-hidden="true">
      <path d="M0 5h48M72 5h48" stroke="#e0bd6a" stroke-width="1"/>

    </svg>
  </header>

  <div class="marco"><section class="rejilla" id="rejilla" aria-label="Puertas del calendario"></section></div>

  <footer id="pie"></footer>
</main>

<div class="velo" id="velo" role="dialog" aria-modal="true" aria-labelledby="carta-titulo">
  <article class="carta" id="carta"></article>
</div>
<div class="aviso" id="aviso" role="status"></div>
<button class="btn-animos" id="btnAnimos" type="button">🆘 Ánimos</button>
<button class="btn-cartera" id="btnCartera" type="button" hidden>🎟️ Mis vales <b id="nVales">0</b></button>
<div class="suelo" aria-hidden="true"><svg viewBox="0 0 400 16" preserveAspectRatio="none">
  <path d="M0 9Q25 1 50 7T100 6T150 8T200 5T250 8T300 6T350 8T400 6V16H0Z" fill="#eef3fa"/></svg></div>

<script src="mensajes.js"></script>
<script>
(function(){
  const C = window.CALENDARIO || CALENDARIO;
  const $ = (s) => document.querySelector(s);

  /* ---------- Fecha de hoy en hora de España ---------- */
  const params = new URLSearchParams(location.search);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const prueba = params.has(C.clavePrueba || "probar") || C.abrirTodo === true;

  function hoyMadrid(){
    if (prueba && params.get("hoy")) {            // solo para probar: ?probar&hoy=2026-12-05
      const [y,m,d] = params.get("hoy").split("-").map(Number);
      return {y,m,d};
    }
    const partes = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid",year:"numeric",month:"numeric",day:"numeric"})
      .formatToParts(new Date());
    const v = t => Number(partes.find(p => p.type === t).value);
    return {y:v("year"), m:v("month"), d:v("day")};
  }
  const hoy = hoyMadrid();
  const ANIO = C.anio;
  const diaActual = (hoy.y === ANIO && hoy.m === 12) ? hoy.d : (hoy.y > ANIO ? 99 : 0);
  const disponible = n => (prueba && !params.get("hoy")) || diaActual >= n;

  /* ---------- Puertas abiertas (se recuerdan en el móvil) ---------- */
  const CLAVE = "adviento-abiertas-" + ANIO;
  let abiertas = [];
  try { abiertas = JSON.parse(localStorage.getItem(CLAVE)) || []; } catch(e){}
  const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(abiertas)); } catch(e){} };

  /* ---------- Estilo de las puertas ---------- */
  const estilo = params.get("estilo") || C.estilo || "clasico";
  document.body.classList.add("estilo-" + estilo);

  /* ---------- Cabecera ---------- */
  $("#nombre").textContent = C.nombre || "ti";
  $("#pie").textContent = C.firma || "";
  const estado = $("#estado"), reloj = $("#reloj");
  if (diaActual === 0) {
    const falta = Math.round((Date.UTC(ANIO,11,1) - Date.UTC(hoy.y,hoy.m-1,hoy.d)) / 864e5);
    estado.textContent = falta === 1 ? "Mañana se abre la primera puerta ✨"
                                     : `Faltan ${falta} días para abrir la primera puerta ✨`;
  } else if (diaActual <= 24) {
    estado.textContent = diaActual === 24 ? "Hoy se abre la última puerta 🎁"
                                          : `Hoy toca la puerta ${diaActual} 🎁`;
  } else {
    estado.textContent = "Feliz Navidad ❤️";
  }
  if (prueba) {
    const b = document.createElement("div");
    b.className = "modo-prueba";
    b.innerHTML = 'MODO PRUEBA · todas abiertas <button type="button">↺ Cerrar todas</button>';
    b.querySelector("button").onclick = () => {
      abiertas = []; guardar();
      try { Object.keys(localStorage).filter(k => /^adviento-(ruleta|juego|rasca)-/.test(k)).forEach(k => localStorage.removeItem(k)); } catch(e){}
      canjeados = []; guardarCanj();
      document.querySelectorAll(".puerta.abierta").forEach(p => p.classList.remove("abierta","instant"));
      actualizarCartera();
    };
    document.body.appendChild(b);
    document.body.classList.add("con-prueba");
  }


  /* ---------- Dibujo del churro con chocolate ---------- */
  const unChurro = (x, giro) => `
      <g transform="rotate(${giro} ${x+6} 58)">
        <rect x="${x}" y="6" width="12" height="56" rx="6" fill="url(#gch)"/>
        <path d="M${x+3.5} 11V58M${x+6} 9V60M${x+8.5} 11V58" stroke="#99561a" stroke-width="1.1" opacity=".55"/>
        <g fill="#fff" opacity=".9">
          <circle cx="${x+3}" cy="16" r=".9"/><circle cx="${x+8}" cy="22" r=".8"/><circle cx="${x+5}" cy="30" r=".9"/>
          <circle cx="${x+9}" cy="37" r=".8"/><circle cx="${x+4}" cy="43" r=".8"/><circle cx="${x+7}" cy="12" r=".7"/>
        </g>
      </g>`;
  const CHURRO_SVG = `
    <svg class="churro-svg" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="gch" x1="0" x2="1">
        <stop offset="0" stop-color="#b86a22"/><stop offset=".45" stop-color="#eeb066"/><stop offset="1" stop-color="#a95f1d"/>
      </linearGradient></defs>
      ${unChurro(30,-16)}${unChurro(52,14)}
      <ellipse cx="50" cy="95" rx="40" ry="4.5" fill="#e9dcc3"/>
      <path d="M78 63q15 1 11 14q-3 9-13 6" fill="none" stroke="#f7efe1" stroke-width="5" stroke-linecap="round"/>
      <path d="M21 57H79L73 88Q72 93 66 93H34Q28 93 27 88Z" fill="#fbf5ea" stroke="#d8c6a8" stroke-width="1"/>
      <path d="M23.5 66H76.5" stroke="#8f2633" stroke-width="2.2"/>
      <ellipse cx="50" cy="57" rx="29" ry="6" fill="#4a2410"/>
      <ellipse cx="44" cy="56" rx="10" ry="1.6" fill="#7a4224" opacity=".7"/>
    </svg>`;
  const diasChurro = Array.isArray(C.churros) ? C.churros : [];

  /* ---------- Cuenta atrás en directo ---------- */
  let vernosUTC = null;
  if (C.fechaVernos) {
    const [vy,vm,vd] = C.fechaVernos.split("-").map(Number);
    vernosUTC = Date.UTC(vy, vm-1, vd);
  }
  const dos = x => String(x).padStart(2,"0");
  const hms = seg => `${dos(Math.floor(seg/3600))}:${dos(Math.floor(seg%3600/60))}:${dos(seg%60)}`;
  function segHastaMedianoche(){
    const pt = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Madrid",hour:"numeric",minute:"numeric",second:"numeric",hour12:false})
      .formatToParts(new Date());
    const v = t => Number(pt.find(p => p.type === t).value) % (t === "hour" ? 24 : 60);
    return 86400 - (v("hour")*3600 + v("minute")*60 + v("second"));
  }
  function tic(){
    const s = segHastaMedianoche();
    const hoyUTC = Date.UTC(hoy.y,hoy.m-1,hoy.d);
    // Próxima puerta
    if (diaActual === 0) {
      const dias = Math.round((Date.UTC(ANIO,11,1) - hoyUTC) / 864e5) - 1;
      reloj.textContent = `⏳ La primera puerta se abre en ${dias > 0 ? dias + "d " : ""}${hms(s)}`;
    } else if (diaActual < 24) {
      reloj.textContent = `⏳ Siguiente puerta en ${hms(s)}`;
    } else reloj.textContent = "";
    // Para vernos
    if (typeof textoVuelo === "function" && VUELO_LISTO) { $("#juntos").textContent = textoVuelo(); actualizarViaje(); }
    else if (vernosUTC != null) {
      const f = Math.round((vernosUTC - hoyUTC) / 864e5);
      $("#juntos").textContent = f > 1 ? `❤️ Faltan ${f} días para vernos`
                               : f === 1 ? `❤️ Nos vemos en ${hms(s)}`
                               : f === 0 ? "❤️ ¡Hoy nos vemos!" : "";
    }
  }
  let VUELO_LISTO = false;
  tic(); setInterval(tic, 1000);
  const vernosEn = n => vernosUTC == null ? "" : Math.round((vernosUTC - Date.UTC(ANIO,11,n)) / 864e5);
  const rellenar = (t, n) => String(t).replace(/\{vernos\}/g, vernosEn(n));


  /* ---------- Ruleta ---------- */
  function crearRuleta(cfg, n){
    const vals = (cfg.valores && cfg.valores.length) ? cfg.valores : [10,15,20,25,30,40,45,60];
    const unidad = cfg.unidad || "minutos de masaje relajante";
    const seg = 360 / vals.length;
    const clave = `adviento-ruleta-${ANIO}-${n}`;
    const colores = ["#8f2633","#efe5d0","#1e4a3a","#efe5d0"];
    const P = (a,r) => [(Math.sin(a*Math.PI/180)*r).toFixed(2), (-Math.cos(a*Math.PI/180)*r).toFixed(2)];
    let svg = `<svg viewBox="-100 -100 200 200"><circle r="99" fill="#c99a3a"/>`;
    vals.forEach((v,i) => {
      const a0 = i*seg, a1 = (i+1)*seg, [x0,y0] = P(a0,92), [x1,y1] = P(a1,92);
      const fondo = colores[i % colores.length], claro = fondo === "#efe5d0";
      svg += `<path d="M0 0L${x0} ${y0}A92 92 0 ${seg>180?1:0} 1 ${x1} ${y1}Z" fill="${fondo}" stroke="#c99a3a" stroke-width="1.5"/>`;
      svg += `<text transform="rotate(${a0+seg/2}) translate(0 -62)" text-anchor="middle" dominant-baseline="middle"
                font-family="Fraunces,Georgia,serif" font-weight="700" font-size="${vals.length>10?15:20}"
                fill="${claro ? "#8f2633" : "#f6e3b0"}">${v}</text>`;
    });
    for (let k=0;k<24;k++){ const [x,y] = P(k*15,95.5); svg += `<circle cx="${x}" cy="${y}" r="1.9" fill="${k%2?"#fff6dc":"#7a5a1c"}"/>`; }
    svg += `</svg>`;

    const caja = el("div","ruleta");
    const marco = el("div","ruleta-caja");
    const rueda = el("div","rueda"); rueda.innerHTML = svg;
    marco.append(el("div","ruleta-flecha"), rueda, el("div","ruleta-centro","💆‍♀️"));
    const boton = el("button","boton-girar","🎡 ¡Girar!"); boton.type = "button";
    const res = el("div","ruleta-res");
    caja.append(marco, boton, res);

    const mostrarRes = (v) => {
      res.innerHTML = "";
      const vv = crearVale(cfg.tipoVale || "spa", `${v} ${unidad}`, n);
      res.append(vv);
    };
    let rot = 0, girando = false, guardado = null;
    try { guardado = JSON.parse(localStorage.getItem(clave)); } catch(e){}
    if (guardado && typeof guardado.i === "number" && vals[guardado.i] === guardado.v) {
      rot = -(guardado.i*seg + seg/2);
      rueda.style.transition = "none"; rueda.style.transform = `rotate(${rot}deg)`;
      mostrarRes(guardado.v);
      if (prueba) boton.textContent = "🎡 Girar otra vez";
      else { boton.disabled = true; boton.textContent = "Ya has girado la ruleta 😌"; }
    }
    boton.onclick = () => {
      if (girando) return;
      girando = true; boton.disabled = true; res.innerHTML = "";
      const i = Math.floor(Math.random()*vals.length);
      const jitter = (Math.random()-.5) * seg * .6;
      const deseado = (((-(i*seg + seg/2) + jitter) % 360) + 360) % 360;
      const actual = ((rot % 360) + 360) % 360;
      rot = rot + 360*6 + ((deseado - actual + 360) % 360);
      rueda.style.transition = reduce ? "transform .6s ease-out" : "";
      requestAnimationFrame(() => { rueda.style.transform = `rotate(${rot}deg)`; });
      setTimeout(() => {
        girando = false;
        try { localStorage.setItem(clave, JSON.stringify({i, v: vals[i]})); } catch(e){}
        mostrarRes(vals[i]);
        try { navigator.vibrate && navigator.vibrate([30,60,30,60,80]); } catch(e){}
        if (!reduce) celebrar(marco, n);
        actualizarCartera();
        if (prueba) { boton.disabled = false; boton.textContent = "🎡 Girar otra vez"; }
        else boton.textContent = "¡Hecho! Ya no hay vuelta atrás 😌";
        res.scrollIntoView({behavior:"smooth", block:"nearest"});
      }, reduce ? 700 : 4900);
    };
    return caja;
  }



  /* ===================== EL VIAJE HACIA TI ✈️ ===================== */
  const VUELO = Object.assign({
    origen:"Elche", codOrigen:"ALC", destino:"Bilbao", codDestino:"BIO",
    fecha:"2026-12-26", hora:"09:00", pasajero:"Tu chico",
    asiento:"Ventanilla, para ver Bilbao antes", equipaje:"Ganas de verte (exceso de peso)", motivo:"Jurdana ❤️"
  }, C.vuelo || {});
  const LLEGADA = Date.parse(`${VUELO.fecha}T${VUELO.hora}:00+01:00`);
  const SALIDA  = Date.parse(`${ANIO}-12-01T00:00:00+01:00`);
  const ahoraMs = () => (prueba && params.get("hoy"))
    ? Date.parse(`${params.get("hoy")}T12:00:00+01:00`)
    : Date.now();
  const cuenta = ms => {
    const t = Math.max(0, Math.floor(ms/1000)), d = Math.floor(t/86400);
    return (d > 0 ? d + "d " : "") + hms(t % 86400);
  };
  function textoVuelo(){
    const falta = LLEGADA - ahoraMs();
    if (falta > 0) return `✈️ Aterrizo en ${VUELO.destino} en ${cuenta(falta)}`;
    if (falta > -86400000) return `🛬 ¡He aterrizado en ${VUELO.destino}!`;
    return "";
  }

  // Mapa: península simplificada (lon, lat)
  const PEN = [[-9.3,43.0],[-8.0,43.7],[-7.0,43.55],[-5.8,43.6],[-4.5,43.42],[-3.8,43.47],[-2.9,43.35],[-1.8,43.38],[-1.4,43.05],
    [0.7,42.8],[1.7,42.5],[3.2,42.4],[3.2,41.9],[2.2,41.4],[0.9,41.0],[0.5,40.6],[-0.3,39.5],[0.2,38.8],[-0.5,38.3],[-0.75,37.6],
    [-1.6,37.25],[-2.0,36.75],[-3.5,36.72],[-4.4,36.7],[-5.35,36.15],[-5.6,36.0],[-6.3,36.5],[-6.9,37.15],[-7.4,37.2],[-8.9,37.0],
    [-8.8,38.5],[-9.5,38.75],[-9.0,39.6],[-8.9,40.5],[-8.7,41.2],[-8.9,42.0]];
  const PX = (lon,lat) => [((lon + 9.6) * .766 * 30).toFixed(1), ((43.95 - lat) * 30).toFixed(1)];
  const isla = (lon,lat,rx,ry) => { const [x,y] = PX(lon,lat); return `<ellipse class="tierra" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/>`; };

  let viajeEl = null, rutaHecha = null, rutaLen = 0, rutaPath = null, avionEl = null;
  function crearViaje(){
    const [ex,ey] = PX(-0.70,38.27), [bx,by] = PX(-2.93,43.26);
    const cx = (+ex + +bx)/2 + 38, cy = (+ey + +by)/2 - 13;
    const d = `M${ex} ${ey}Q${cx} ${cy} ${bx} ${by}`;
    viajeEl = el("section","viaje");
    viajeEl.innerHTML = `

      const TW = Math.max(48, W*(P.taza || .2)), TY = H - 46;

      const mover = e => { const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) * (W / r.width); taza = Math.max(TW/2, Math.min(W - TW/2, x)); };
      cv.addEventListener("pointerdown", e => { mover(e); try { cv.setPointerCapture(e.pointerId); } catch(_){} });
      cv.addEventListener("pointermove", mover);
      const tecla = e => { if (e.key === "ArrowLeft") taza = Math.max(TW/2, taza - 28); if (e.key === "ArrowRight") taza = Math.min(W - TW/2, taza + 28); };
      document.addEventListener("keydown", tecla);
      juegoStop = () => { vivo = false; cancelAnimationFrame(raf); document.removeEventListener("keydown", tecla); };

      const nuevo = () => churros.push({x:24 + Math.random()*(W-48), y:-30, v:P.v[0] + Math.random()*(P.v[1]-P.v[0]),
        rot:(Math.random()-.5)*.7, vr:(Math.random()-.5)*2.2, dorado:Math.random() < .07,
        zig:Math.random() < P.zig ? 1.6 + Math.random()*1.6 : 0, fase:Math.random()*6});

      function churro(c){
        ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
        const g = ctx.createLinearGradient(-6,0,6,0);
        if (c.dorado) { g.addColorStop(0,"#d9a521"); g.addColorStop(.5,"#fff0a8"); g.addColorStop(1,"#c9921a"); ctx.shadowColor = "rgba(255,210,80,.95)"; ctx.shadowBlur = 14; }
        else { g.addColorStop(0,"#b86a22"); g.addColorStop(.5,"#eeb066"); g.addColorStop(1,"#a95f1d"); }
        ctx.fillStyle = g; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-6,-22,12,44,6); else ctx.rect(-6,-22,12,44); ctx.fill(); ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(120,60,15,.5)"; ctx.lineWidth = 1;
        [-2.5,0,2.5].forEach(dx => { ctx.beginPath(); ctx.moveTo(dx,-18); ctx.lineTo(dx,18); ctx.stroke(); });
        ctx.fillStyle = "rgba(255,255,255,.9)";
        [[-3,-12],[2,-4],[-1,6],[3,13]].forEach(([a,b]) => { ctx.beginPath(); ctx.arc(a,b,.9,0,7); ctx.fill(); });
        ctx.restore();

      function dibujarTaza(){
        const x = taza, y = TY;
        ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.beginPath(); ctx.ellipse(x, y+40, TW*.62, 6, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#e9dcc3"; ctx.beginPath(); ctx.ellipse(x, y+36, TW*.6, 6, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = "#f7efe1"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(x + TW/2 + 2, y+16, 10, -1.3, 1.3); ctx.stroke();
        ctx.fillStyle = "#fbf5ea"; ctx.strokeStyle = "#d8c6a8"; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(x - TW/2, y); ctx.lineTo(x + TW/2, y); ctx.lineTo(x + TW/2 - 7, y+34); ctx.lineTo(x - TW/2 + 7, y+34); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#8f2633"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - TW/2 + 3, y+12); ctx.lineTo(x + TW/2 - 3, y+12); ctx.stroke();
        ctx.fillStyle = "#4a2410"; ctx.beginPath(); ctx.ellipse(x, y, TW/2, 6, 0, 0, 7); ctx.fill();
      }
      function frame(ts){

  function crearRasca(src, n, alt){
    const clave = `adviento-rasca-${ANIO}-${n}`;
    let hecho = false; try { hecho = localStorage.getItem(clave) === "1"; } catch(e){}
    const w = el("div","rasca"), img = el("img"); img.src = src; img.alt = alt || ""; w.append(img);
    if (hecho || reduce) return w;
    const cv = el("canvas","rasca-nieve"), pista = el("div","rasca-pista","❄️ Rasca la nieve con el dedo");
    w.append(cv, pista);
    const ctx = cv.getContext("2d");
    let dpr = 1, ancho = 0, alto = 0, rascando = false, prev = null, cuenta = 0, acabado = false;
    function pintar(){
      ancho = w.offsetWidth; alto = w.offsetHeight; if (!ancho || !alto) return;
      dpr = Math.min(devicePixelRatio || 1, 2);
      cv.width = ancho*dpr; cv.height = alto*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      const g = ctx.createLinearGradient(0,0,0,alto); g.addColorStop(0,"#ffffff"); g.addColorStop(1,"#dfe9f5");
      ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = g; ctx.fillRect(0,0,ancho,alto);
      for (let i=0;i<140;i++){ ctx.fillStyle = `rgba(${170+Math.random()*60},${195+Math.random()*40},235,${.15+Math.random()*.35})`;
        ctx.beginPath(); ctx.arc(Math.random()*ancho, Math.random()*alto, .6+Math.random()*2.2, 0, 7); ctx.fill(); }
      ctx.fillStyle = "rgba(120,160,210,.35)"; ctx.font = "26px serif"; ctx.textAlign = "center";
      for (let i=0;i<7;i++) ctx.fillText("❄", ancho*(.1 + Math.random()*.8), alto*(.12 + Math.random()*.7));
    }
    if (img.complete) requestAnimationFrame(pintar); else img.addEventListener("load", () => requestAnimationFrame(pintar));
    const punto = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * ancho / r.width, (e.clientY - r.top) * alto / r.height]; };
    function rascar(e){
      if (!rascando || acabado) return;
      const [x,y] = punto(e);
      ctx.globalCompositeOperation = "destination-out"; ctx.lineCap = "round"; ctx.lineWidth = 46;
      ctx.beginPath(); if (prev) { ctx.moveTo(prev[0],prev[1]); ctx.lineTo(x,y); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(x,y,23,0,7); ctx.fill();
      prev = [x,y];
      pista.style.opacity = 0;
      if (++cuenta % 6 === 0) comprobar();
    }
    function comprobar(){
      const datos = ctx.getImageData(0,0,cv.width,cv.height).data;
      let vacio = 0, total = 0;
      for (let i=3;i<datos.length;i+=4*37){ total++; if (datos[i] < 40) vacio++; }
      if (vacio/total > .55) {
        acabado = true;
        try { localStorage.setItem(clave,"1"); } catch(_){}
        cv.animate([{opacity:1},{opacity:0}],{duration:600, fill:"forwards"}).onfinish = () => { cv.remove(); pista.remove(); };
        if (!reduce) celebrar(w, n);
      }
    }
    cv.addEventListener("pointerdown", e => { rascando = true; prev = null; try { cv.setPointerCapture(e.pointerId); } catch(_){} rascar(e); });
    cv.addEventListener("pointermove", rascar);
    ["pointerup","pointercancel","pointerleave"].forEach(t => cv.addEventListener(t, () => { rascando = false; prev = null; }));
    return w;
  }

    }, D*.45);
    return 760;
  }

  const ANIMS = {zoom:animZoom, papel:animPapel, nieve:animNieve, reno:animReno};
  const tipoAnim = n => {
    const d = (C.dias && C.dias[n]) || {};
    return params.get("anim") || d.animacion || (n === 24 ? "zoom" : ["zoom","papel","nieve","reno"][(n-1) % 4]);
  };

  /* ===================== TRINEO CADA 10 s ===================== */
  let vuelos = 0;
  function volarTrineo(){
    if (document.hidden) return;
    const t = document.createElement("div"); t.className = "trineo"; t.innerHTML = TRINEO_SVG;
    const w = Math.max(180, Math.min(320, innerWidth*.45)); t.style.width = w + "px";
    document.body.insertBefore(t, document.querySelector("main"));
    const h = w * 92/330;
    const dir = vuelos++ % 2 === 0 ? 1 : -1;
    const yBase = 4 + Math.random()*14 + (document.body.classList.contains("con-prueba") ? 40 : 0);
    const dur = 6500, t0 = performance.now();
    let ultima = 0;
    function frame(now){
      const p = (now - t0) / dur;
      if (p >= 1) { t.remove(); return; }
      const recorrido = innerWidth + w*2;
      const x = dir === 1 ? -w + p*recorrido - w*0 : innerWidth - p*recorrido;
      const y = yBase + Math.sin(p*Math.PI*2)*9 + Math.sin(p*Math.PI)*6;
      const ang = -Math.cos(p*Math.PI*2)*5;
      t.style.transform = `translate(${x}px,${y}px) scaleX(${dir}) rotate(${ang}deg)`;
      if (now - ultima > 45) {
        ultima = now;
        const e = document.createElement("div"); e.className = "estela";
        const tam = 2 + Math.random()*3; e.style.width = e.style.height = tam + "px";
        const ex = dir === 1 ? x + w*.04 : x + w*.96, ey = y + h*.78 + (Math.random()-.5)*8;
        document.body.insertBefore(e, t);
        e.animate([{transform:`translate(${ex}px,${ey}px)`,opacity:1},{transform:`translate(${ex - dir*10}px,${ey + 22}px)`,opacity:0}],
          {duration:1100 + Math.random()*500, easing:"ease-out"}).onfinish = () => e.remove();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ===================== RENO QUE PASEA ===================== */
  function crearPaseo(){
    const paseo = document.createElement("div"); paseo.className = "reno-paseo camina";
    paseo.setAttribute("aria-hidden","true");
    paseo.innerHTML = `<div class="salto">${RENO_SVG}</div>`;
    document.body.appendChild(paseo);
    const svg = paseo.querySelector("svg"), salto = paseo.querySelector(".salto");
    let x = -80, dir = 1, pausaHasta = 0, proxPausa = innerWidth*(.25 + Math.random()*.5), ult = performance.now();
    function paso(now){
      const dt = Math.min(60, now - ult) / 1000; ult = now;
      if (now < pausaHasta) paseo.classList.remove("camina");
      else {
        paseo.classList.add("camina");
        x += dir * 38 * dt;
        if (proxPausa > 0 && ((dir === 1 && x > proxPausa) || (dir === -1 && x < proxPausa))) {
          pausaHasta = now + 2300; proxPausa = -1;
          paseo.classList.add("mira"); setTimeout(() => paseo.classList.remove("mira"), 2300);
        }
        if (dir === 1 && x > innerWidth + 20) { dir = -1; pausaHasta = now + 2500; proxPausa = innerWidth*(.2 + Math.random()*.6); }
        if (dir === -1 && x < -100) { dir = 1; pausaHasta = now + 2500; proxPausa = innerWidth*(.2 + Math.random()*.6); }
      }
      paseo.style.transform = `translateX(${x}px)`;
      svg.style.transform = `scaleX(${dir})`;
      requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
    paseo.addEventListener("click", () => {
      salto.animate([{transform:"translateY(0)"},{transform:"translateY(-46px) rotate(-8deg)",offset:.45},
        {transform:"translateY(0)",offset:.85},{transform:"translateY(-6px)",offset:.93},{transform:"translateY(0)"}],
        {duration:650, easing:"ease-out"});
      try { navigator.vibrate && navigator.vibrate(20); } catch(e){}
      const r = rectDe(paseo);
      for (let i=0;i<6;i++){
        const s = document.createElement("span"); s.className = "fx-p"; s.textContent = ["❤️","💛","✨"][i%3];
        s.style.fontSize = (13 + Math.random()*8) + "px";
        s.style.left = (r.left + r.width/2) + "px"; s.style.top = r.top + "px"; s.style.zIndex = 5;
        document.body.appendChild(s);
        s.animate([{transform:"translate(-50%,0) scale(.4)",opacity:0},{opacity:1,offset:.2},
          {transform:`translate(calc(-50% + ${(Math.random()-.5)*80}px),${-70 - Math.random()*50}px) scale(1.1)`,opacity:0}],
          {duration:1100 + Math.random()*400, delay:i*60, easing:"ease-out", fill:"backwards"}).onfinish = () => s.remove();
      }
    });
  }

  /* ===================== CARTERA DE VALES ===================== */
  const CLAVE_CANJ = "adviento-canjeados-" + ANIO;
  let canjeados = [];
  try { canjeados = JSON.parse(localStorage.getItem(CLAVE_CANJ)) || []; } catch(e){}
  const guardarCanj = () => { try { localStorage.setItem(CLAVE_CANJ, JSON.stringify(canjeados)); } catch(e){} };
  let totalVales = -1;

  function valesDesbloqueados(){
    const lista = [];
    for (let n=1;n<=24;n++){
      const d = C.dias && C.dias[n];
      if (!d || !abiertas.includes(n) || !disponible(n)) continue;
      if (d.vale && d.juego) {
        const g = leerJuego(n);
        lista.push(g && g.ganado ? {id:"v"+n, n, tipo:d.tipoVale, texto:rellenar(d.vale,n) + (g.nivel === "dificil" ? " + ración doble, por campeona 🏆" : "")}
                                 : {id:"v"+n, n, tipo:d.tipoVale, texto:"Vale bloqueado: ¡gana el juego del día para conseguirlo! 🎮", pendiente:true});
      } else if (d.vale) lista.push({id:"v"+n, n, tipo:d.tipoVale, texto:rellenar(d.vale,n)});
      if (d.ruleta) {
        let g = null; try { g = JSON.parse(localStorage.getItem(`adviento-ruleta-${ANIO}-${n}`)); } catch(e){}
        lista.push(g ? {id:"r"+n, n, tipo:d.tipoVale || "spa", texto:`${g.v} ${d.ruleta.unidad || "minutos de masaje relajante"}`}
                     : {id:"r"+n, n, texto:"Ruleta del masaje: ¡aún no la has girado! 🎡", pendiente:true});
      }
    }
    return lista;
  }
  function actualizarCartera(){
    const btn = $("#btnCartera"), lista = valesDesbloqueados();
    btn.hidden = lista.length === 0;
    $("#nVales").textContent = lista.filter(v => !v.pendiente && !canjeados.includes(v.id)).length;
    if (totalVales >= 0 && lista.length > totalVales && !reduce)
      btn.animate([{transform:"scale(1)"},{transform:"scale(1.3) rotate(-6deg)"},{transform:"scale(.95)"},{transform:"scale(1)"}],
        {duration:600, delay:400, easing:"ease-out"});
    totalVales = lista.length;
  }
  function mostrarCartera(){
    pararEscritura(); pararJuego();
    carta.innerHTML = ""; carta.classList.remove("con-nota");
    const x = el("button","cerrar","×"); x.setAttribute("aria-label","Cerrar"); x.onclick = cerrar;
    carta.append(x, el("div","big-icono","🎟️"));
    const h = el("h2",null,"Tu cartera de vales"); h.id = "carta-titulo"; carta.append(h);
    carta.append(el("p","nota","Guárdalos bien: me los puedes reclamar cuando nos veamos 😏\nCuando usemos uno, tócalo y quedará canjeado."));
    const lista = valesDesbloqueados(), cont = el("div","tickets");
    if (!lista.length) cont.append(el("p","vacio","Todavía no tienes vales. ¡Sigue abriendo puertas!"));
    lista.forEach(v => {
      const t = el("button","ticket" + (v.tipo && !v.pendiente ? " t-" + v.tipo : "") + (v.pendiente ? " pend" : "") + (canjeados.includes(v.id) ? " usado" : ""));
      t.type = "button";
      const dia = el("div","ticket-dia"); dia.append(ICONO_VALE[v.tipo] || "Día", el("b",null,String(v.n)));
      t.append(dia, el("div","ticket-txt",v.texto));
      if (!v.pendiente) t.onclick = () => {
        canjeados = canjeados.includes(v.id) ? canjeados.filter(c => c !== v.id) : [...canjeados, v.id];
        guardarCanj(); t.classList.toggle("usado"); actualizarCartera();
      };
      cont.append(t);
    });
    carta.append(cont);
    if (C.firma) carta.append(el("div","firma",C.firma));
    velo.classList.add("visible"); carta.scrollTop = 0;
    if (!reduce) vuelo($("#btnCartera"), false);

  /* ===================== DÍA 24: SE ESCRIBE SOLO ===================== */
  let escrituraT = null, escrituraFin = null;
  function pararEscritura(){ clearTimeout(escrituraT); if (escrituraFin) escrituraFin(); escrituraFin = null; }
  function escribir(p, texto){
    p.textContent = "";
    const nodo = document.createTextNode(""), cur = el("span","cursor","|");
    p.append(nodo, cur);
    let i = 0;
    const fin = () => { clearTimeout(escrituraT); nodo.data = texto; cur.remove(); escrituraFin = null; carta.removeEventListener("click", fin); };
    escrituraFin = fin;
    const paso = () => {
      if (i >= texto.length) { fin(); return; }
      const ch = texto[i++]; nodo.data += ch;
      if (ch === "\n") cur.scrollIntoView({block:"nearest", behavior:"smooth"});
      escrituraT = setTimeout(paso, ch === "\n" ? 420 : /[.,!?:…]/.test(ch) ? 230 : 32 + Math.random()*34);
    };
    escrituraT = setTimeout(paso, 1000);
    carta.addEventListener("click", fin);   // tocar la carta = verlo entero
  }

  /* ---------- Construir las puertas ---------- */
  const orden = [7,18,3,12,24,1,15,9,21,5,14,10,2,19,8,23,4,13,17,11,22,6,16,20];
  const tonos = ["rojo","verde","crema","azul","rojo","crema","verde","rojo","azul","crema","verde","rojo"];
  const rejilla = $("#rejilla");
  rejilla.style.setProperty("--nv", (3 + Math.min(Math.max(diaActual,0),24) * .5) + "px");   // la nieve crece cada día

  orden.forEach((n,i) => {

    btn.innerHTML = `<span class="hueco"><span class="icono"></span></span><span class="hoja"><span class="deco"></span><span class="num">${n}</span></span>`;
    btn.querySelector(".icono").textContent = info.icono || "🎁";
    btn.insertAdjacentHTML("beforeend", '<span class="capa-nieve" aria-hidden="true"></span>');
    if (n === diaActual && !reduce) btn.insertAdjacentHTML("afterbegin", `<span class="asoma" aria-hidden="true">${ASOMA_SVG}</span>`);
    if (diasChurro.includes(n)) {

  /* ---------- Al tocar una puerta ---------- */
  let avisoT;
  function avisar(txt){
    const a = $("#aviso"); a.textContent = txt; a.classList.add("visible");
    clearTimeout(avisoT); avisoT = setTimeout(() => a.classList.remove("visible"), 2400);
  }

  let animando = false;
  function pulsar(btn, n){
    if (animando) return;
    if (!disponible(n)) {
      btn.classList.remove("tiembla"); void btn.offsetWidth; btn.classList.add("tiembla");
      const faltan = diaActual === 0
        ? Math.round((Date.UTC(ANIO,11,n) - Date.UTC(hoy.y,hoy.m-1,hoy.d)) / 864e5)
        : n - diaActual;
      avisar(faltan === 1 ? "¡Mañana! Un poquito de paciencia 🤭" : `Aún no… faltan ${faltan} días 🤭`);
      return;
    }
    if (btn.classList.contains("abierta")) { mostrar(n, btn, false); return; }
    if (!abiertas.includes(n)) { abiertas.push(n); guardar(); }
    try { navigator.vibrate && navigator.vibrate([12, 60, 28]); } catch(e){}
    if (reduce) {
      btn.classList.add("abierta");
      setTimeout(() => { mostrar(n, btn, true); actualizarCartera(); }, 300);
      return;
    }
    animando = true;
    const ms = (ANIMS[tipoAnim(n)] || animZoom)(btn, n);
    setTimeout(() => {
      celebrar(btn, n);
      if (n === 24) setTimeout(lluviaCorazones, 400);
      mostrar(n, btn, true);
      actualizarCartera();
      animando = false;
    }, ms);
  }

  /* ---------- La carta con el contenido ---------- */
  const velo = $("#velo"), carta = $("#carta");

  /* La tarjeta sale volando desde la puerta */
  function vuelo(origen, especial){
    carta.style.transition = "none";
    const a = origen.getBoundingClientRect(), b = carta.getBoundingClientRect();
    const dx = (a.left + a.width/2) - (b.left + b.width/2);
    const dy = (a.top + a.height/2) - (b.top + b.height/2);
    const sc = Math.max(.12, a.width / b.width);
    const anim = carta.animate([
      {transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(-8deg)`, opacity:.2, offset:0},
      {transform:"translate(0,-14px) scale(1.04) rotate(1.5deg)", opacity:1, offset:.7},
      {transform:"none", opacity:1}
    ], {duration: especial ? 720 : 480, easing:"cubic-bezier(.2,.8,.25,1)"});
    anim.onfinish = () => { carta.style.transition = ""; };
    // el contenido aparece en cascada
    const postit = carta.querySelector(".postit");
    if (postit) postit.animate([{transform:"rotate(-20deg) scale(1.8)",opacity:0},{transform:"rotate(-3deg) scale(.92)",opacity:1,offset:.7},
      {transform:"rotate(-6deg) scale(1)",opacity:1}],{duration:480, delay:850, easing:"cubic-bezier(.3,1.4,.5,1)", fill:"backwards"});
    [...carta.children].filter(c => !["cerrar","barrido","postit"].some(k => c.classList.contains(k)))
      .forEach((c,i) => {
        const pop = c.classList.contains("big-icono");
        c.animate(pop
          ? [{transform:"scale(0) rotate(-40deg)",opacity:0},{transform:"scale(1.45) rotate(10deg)",opacity:1,offset:.6},{transform:"none",opacity:1}]
          : [{transform:"translateY(14px)",opacity:0},{transform:"none",opacity:1}],
          {duration: pop ? 650 : 420, delay: 260 + i*90, easing:"cubic-bezier(.2,.9,.3,1.2)", fill:"backwards"});
      });
  }

  /* Explosión de luz y chispas en la puerta */

    const tipos = ["✨","❤️","⭐","✨","💛"];

        Object.assign(p.style,{width:t+"px",height:(Math.random()<.5?t:t*.45)+"px",borderRadius:Math.random()<.5?"50%":"2px",
          background:["#f3d27a","#e0bd6a","#fff4d6","#c0392b","#ffffff"][i%5],boxShadow:"0 0 6px rgba(255,220,140,.9)"});

        {transform:`translate(calc(-50% + ${tx}px),calc(-50% + ${ty+140}px)) scale(.7) rotate(${rot}deg)`,opacity:0}
      ],{duration:1200+Math.random()*700,easing:"cubic-bezier(.15,.7,.4,1)"}).onfinish = () => p.remove();

  /* Día 24: lluvia de corazones */

  /* ---------- Confeti pequeñito ---------- */
  function confeti(origen){
    const r = origen.getBoundingClientRect();
    const colores = ["#e0bd6a","#8f2633","#f3e2b3","#2f7a5c","#ffffff"];
    for (let i=0;i<36;i++){
      const p = document.createElement("i");
      const s = 5 + Math.random()*5;
      Object.assign(p.style,{position:"fixed",left:(r.left+r.width/2)+"px",top:(r.top+r.height/2)+"px",
        width:s+"px",height:s*0.6+"px",background:colores[i%colores.length],zIndex:15,borderRadius:"1px",pointerEvents:"none"});
      document.body.appendChild(p);
      const ang = Math.random()*Math.PI*2, dist = 60+Math.random()*110;
      p.animate([
        {transform:"translate(-50%,-50%) rotate(0)",opacity:1},
        {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist+80}px) rotate(${Math.random()*720}deg)`,opacity:0}
      ],{duration:1100+Math.random()*500,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish = () => p.remove();
    }
  }

  /* ---------- Nieve ---------- */
  const cv = $("#nieve"), cx = cv.getContext("2d");
  let W,H,copos=[];
  function tam(){
    const dpr = Math.min(devicePixelRatio||1,2);
    W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width = W+"px"; cv.style.height = H+"px"; cx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(90, W*H/9000));
    copos = Array.from({length:n},() => ({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*2.2,
      v:.25+Math.random()*.7,o:Math.random()*Math.PI*2,a:.35+Math.random()*.5}));
  }
  function bucle(){
    cx.clearRect(0,0,W,H);
    for (const c of copos){
      c.y += c.v; c.o += .01; c.x += Math.sin(c.o)*.35;
      if (c.y > H+5){ c.y = -5; c.x = Math.random()*W; }
      cx.globalAlpha = c.a; cx.beginPath(); cx.arc(c.x,c.y,c.r,0,Math.PI*2); cx.fillStyle = "#fff"; cx.fill();
    }
    requestAnimationFrame(bucle);
  }
  addEventListener("resize", tam); tam();
  if (!reduce) bucle();

  crearViaje(); VUELO_LISTO = true; tic();
  $("#btnAnimos").addEventListener("click", darAnimos);
  cargarTiempo(); setInterval(cargarTiempo, 30*60*1000);
  pantallaLlegada();
  $("#btnCartera").addEventListener("click", mostrarCartera);
  actualizarCartera();
  if (!reduce) {
    crearPaseo();
    setTimeout(() => { volarTrineo(); setInterval(volarTrineo, 10000); }, 2500);
  }
})();
</script>
</body>
</html>
